<span class="page-title">
    <i class="pi pi-chevron-right"></i> Ativos
</span>

<div class="w-full md:w-full lg:w-1/2 mx-auto form-panel flex flex-col">
    @if (loading()) {
    <app-loader />
    } @else {
    <form class="flex-1 flex flex-col" [formGroup]="formGroup">
        <div class="flex-1">

            <div class="flex mb-4">
                <div class="w-1/5 pr-2 flex items-center">
                    <label for="descricao">Descrição</label>
                </div>
                <div class="w-4/5">
                    <input type="text" pInputText class="w-full" formControlName="descricao" />
                </div>
            </div>

            <div class="flex mb-4">
                <div class="w-1/5 pr-2 flex items-center">
                    <label for="cor">Cor</label>
                </div>
                <div class="w-4/5">
                    <p-colorpicker defaultColor="3B3B3B" class="w-full" formControlName="cor" />
                </div>
            </div>

            <div class="flex mb-4">
                <div class="w-1/5 pr-2 flex items-center">
                    <label for="moeda">Moeda</label>
                </div>
                <div class="w-1/3">
                    <app-select-moeda formControlName="moeda" />
                </div>
            </div>

            <div class="flex mb-4">
                <div class="w-1/5 pr-2 flex items-center">
                    <label for="tipoAtivo">Tipo de Ativo</label>
                </div>
                <div class="w-1/3">
                    <p-select [options]="tiposAtivo" optionLabel="label" optionValue="value" formControlName="tipoAtivo" placeholder="Selecione" class="w-full" panelClass="w-full">
                        <ng-template pTemplate="selectedItem" let-option>
                            @if (option) {
                            <div class="flex align-items-center gap-2">
                                <i [class]="option.icon"></i>
                                <span>{{ option.label }}</span>
                            </div>
                            }
                        </ng-template>
                        <ng-template pTemplate="item" let-option>
                            <div class="flex align-items-center gap-2">
                                <i [class]="option.icon"></i>
                                <span>{{ option.label }}</span>
                            </div>
                        </ng-template>
                    </p-select>
                </div>
            </div>

            <div class="flex mb-4">
                <div class="w-1/5 pr-2 flex items-center">
                    <label for="valorTotal">Valor Total</label>
                </div>
                <div class="w-4/5">
                    <p-inputgroup>
                        <p-inputgroup-addon>
                            <i class="pi pi-money-bill"></i>
                        </p-inputgroup-addon>
                        <p-inputnumber placeholder="Valor Total" formControlName="valorTotal" locale="pt-BR" [minFractionDigits]="2" [maxFractionDigits]="2" [disabled]="true" />
                    </p-inputgroup>
                </div>
            </div>

            <div class="flex mb-4 py-3">
                <div class="w-1/5 pr-2 flex items-center">
                    <label for="ativo">Ativo</label>
                </div>
                <div class="w-4/5">
                    <p-checkbox size="large" [binary]="true" formControlName="ativo" />
                </div>
            </div>

        </div>

        <div class="mt-auto pt-4">
            <div class="flex justify-between">
                <p-button label="Cancelar" [raised]="true" severity="secondary" size="small" (click)="cancel()" />
                <p-button label="Salvar" [raised]="true" severity="success" size="small" (click)="save()" [disabled]="!formGroup.valid" />
            </div>
        </div>
    </form>
    }
</div>
