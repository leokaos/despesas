<span class="page-title">
    <i class="pi pi-chevron-right"></i> Alertas
</span>

<div class="form-panel">

    <div class="flex justify-end pb-2.5">
        <p-button label="Adicionar" severity="secondary" (click)="add()">
            <i class="pi pi-plus text-2xl"></i>
        </p-button>
    </div>

    @if (loading()) {
    <app-loader />
    }
    @else {
    <p-table
        #table
        stripedRows
        [value]="data()"
        sortMode="single"
        [paginator]="true"
        [rows]="10"
        size="small"
        showGridlines
        [rowsPerPageOptions]="[10, 15, 50, 100]"
        [globalFilterFields]="['tipoLabel', 'descricao', 'diasAntesDeAviso', 'detalhe']">

        <ng-template pTemplate="caption">
            <div class="flex gap-4 justify-end">
                <div class="flex items-center">
                    <button pButton type="button" icon="pi pi-refresh" tooltip="Recarregar" (click)="reload()"> </button>
                </div>
                <div class="flex items-center">
                    <p-iconfield iconPosition="left">
                        <p-inputicon>
                            <i class="pi pi-search"></i>
                        </p-inputicon>
                        <input pInputText type="text" (input)="search()" [(ngModel)]="searchValue" placeholder="Buscar..." />
                    </p-iconfield>
                </div>
            </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th class="force-center" pSortableColumn="descricao">
                    Descrição <p-sortIcon field="descricao" />
                </th>
                <th pSortableColumn="tipoLabel">
                    Tipo <p-sortIcon field="tipoLabel" />
                </th>
                <th pSortableColumn="diasAntesDeAviso">
                    Aviso em (dias) <p-sortIcon field="diasAntesDeAviso" />
                </th>
                <th pSortableColumn="detalhe" class="force-center">
                    Detalhes <p-sortIcon field="detalhe" />
                </th>
                <th class="small-column"></th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-alerta>
            <tr>
                <td> {{alerta.descricao}} </td>
                <td> {{alerta.tipoLabel}} </td>
                <td class="force-center"> {{alerta.diasAntesDeAviso}} </td>
                <td class="force-center"> {{alerta.detalhe}} </td>
                <td class="small-column">
                    <p-button icon="pi pi-trash" severity="danger" (click)="openDialog(alerta)" size="small" />
                </td>
            </tr>
        </ng-template>

        <ng-template #emptymessage>
            <tr>
                <td colspan="6" class="text-center">
                    <div class="flex flex-col items-center justify-center py-12 px-4">
                        <div class="bg-gray-100 rounded-full p-4 mb-4">
                            <i class="pi pi-database text-3xl text-gray-500"></i>
                        </div>
                        <h3 class="text-xl font-semibold text-gray-700 mb-2">
                            Nenhum registro encontrado
                        </h3>
                    </div>
                </td>
            </tr>
        </ng-template>

    </p-table>

    <app-alert-wizard [(showDialog)]="showDialogAdd" [cartoes]="cartoes()" [dividas]="dividas()" (onSave)="save($event)" />

    }

</div>

<p-dialog header="Remover Alerta" [modal]="true" position="top" [(visible)]="showDialogDelete" [style]="{ width: '50rem' }">
    Tem certeza que deseja remover <b>{{alerta?.descricao}}</b> ?

    <ng-template pTemplate="footer">
        <p-button label="Cancel" [raised]="true" severity="secondary" (click)="showDialogDelete.set(false)" />
        <p-button label="Save" [raised]="true" severity="success" (click)="remover()" />
    </ng-template>

</p-dialog>
