<div class="flex flex-col gap-4 p-4">
    <div class="flex flex-col gap-2">
        <label for="tipo">Tipo de Alerta</label>
        <p-select [options]="tiposAlerta" optionLabel="label" optionValue="value" placeholder="Selecione o tipo" class="w-full" appendTo="body" [(ngModel)]="tipo" (onChange)="selectTipo($event)" />
    </div>

    <div class="flex flex-col gap-2">
        <label for="dias">Dias antes do aviso</label>
        <p-inputnumber [min]="1" [max]="365" [showButtons]="true" class="w-full" [(ngModel)]="diasAntesDeAviso" />
    </div>
</div>
